{{ define "main" }}
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
    <main class="cyber-about">
        <!-- Left Column -->
        <div class="cyber-column">
            <section class="cyber-section">
                {{ .Content | safeHTML }} <!-- Your markdown content -->
            </section>
            
            <section class="cyber-section">
                <h2>> HELP_CENSORED_USERS</h2>
                <iframe src="https://snowflake.torproject.org/embed.html" 
                        width="240" 
                        height="240" 
                        class="cyber-iframe"
                        frameborder="0"></iframe>
            </section>

            <section class="cyber-section">
              <h2>> EXPLOIT_DB_LATEST</h2>
              <div class="cyber-feed" id="exploitdb-feed"></div>
            </section>

            <section class="cyber-section">
                <h2>> SOLAR_RADIO_FORECAST</h2>
              <a href="https://www.hamqsl.com/solar.html" title="Click to add Solar-Terrestrial Data to your website!"
        alt="Solar status"> 
                    <img src="https://www.hamqsl.com/solar101vhfpic.php" class="cyber-iframe">
              </a>
            </section>
        </div>
        
        <!-- Right Column -->
        <div class="cyber-column">
            <section class="cyber-section">
                <h2>> GITHUB_STATS</h2>
              <a href="https://github.com/vicendominguez">
                <img src="https://ghchart.rshah.org/00FFFF/vicendominguez" 
                     alt="GitHub Contribution Chart" 
                     class="cyber-iframe">
              </a>
              <br>
              <img src="https://github-readme-stats-sigma-five.vercel.app/api?username=vicendominguez&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0d1117" 
                   alt="GitHub Stats" 
                   class="cyber-iframe">
              <br>
              <img src="https://github-readme-streak-stats.herokuapp.com/?user=vicendominguez&theme=tokyonight&hide_border=true&background=0d1117" 
                   alt="GitHub Streak" 
                   class="cyber-iframe">
            </section>

            <section class="cyber-section">
              <i class="devicon-github-plain" style="font-size: 80px;"></i>
                <div class="cyber-feed" id="github-feed"></div>
            </section>
            
            <section class="cyber-section">
              <i class="devicon-linux-plain" style="font-size: 80px;"></i>
                <div class="cyber-feed" id="kernel-feed"></div>
            </section>

            <section class="cyber-section">
              <i class="devicon-debian-plain" style="font-size: 80px;"></i>
              <div class="cyber-feed" id="debian-feed"></div>
            </section>
        </div>
    <!-- Feed Parser -->
    <script src="{{ "js/feed-parser.js" | relURL }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadFeed('https://github.com/vicendominguez.atom', 'github-feed');
            loadFeed('https://www.kernel.org/feeds/kdist.xml', 'kernel-feed');
            loadFeed('https://www.debian.org/News/news', 'debian-feed');
            loadFeed('https://www.exploit-db.com/rss.xml', 'exploitdb-feed');
        });
    </script>
    </main>
{{ end }}
